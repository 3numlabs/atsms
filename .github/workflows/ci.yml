name: ci

on:
  push:
  pull_request:

# The BeeKEM differential oracle (test/oracle.test.ts) verifies against the
# committed test-vectors/beekem-oracle.json — no Rust toolchain needed in CI.
# Regenerating that file requires the keyhive clone + rustc ≥1.90 (see
# oracle/README.md); it is a deliberate, reviewed step, not a CI action.

jobs:
  unit:
    name: typecheck + unit + vectors
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dcgka
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/dcgka/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  fuzz:
    name: simulation fuzz gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dcgka
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/dcgka/package-lock.json
      - run: npm ci
      - run: npm run test:fuzz
